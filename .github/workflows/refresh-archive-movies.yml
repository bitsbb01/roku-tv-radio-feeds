name: Refresh Internet Archive Movies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    paths:
      - "scripts/refresh_archive_movies.py"
      - ".github/workflows/refresh-archive-movies.yml"

permissions:
  contents: write

concurrency:
  group: archive-movies-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feed dependency
        run: python -m pip install requests
      - name: Build Archive movie feed
        run: python scripts/refresh_archive_movies.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/archive_movies.m3u8 covers/ia-movies/
          if git diff --cached --quiet; then
            echo "Archive movie feed has no changes."
          else
            git commit -m "Refresh Internet Archive movie feed"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase generated changes onto origin/main." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another feed refresh; retrying (attempt $attempt/5)."
              sleep $((attempt * 2))
            done
            echo "Could not push generated changes after 5 attempts." >&2
            exit 1
          fi
