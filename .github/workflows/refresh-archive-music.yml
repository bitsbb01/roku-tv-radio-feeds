name: Refresh Internet Archive Music

on:
  workflow_dispatch:
  schedule:
    - cron: "18 9 * * *"
  push:
    paths:
      - "scripts/refresh_archive_music.py"
      - ".github/workflows/refresh-archive-music.yml"

permissions:
  contents: write

concurrency:
  group: archive-music-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feed dependency
        run: python -m pip install requests
      - name: Build Internet Archive music playlist
        run: python scripts/refresh_archive_music.py
      - name: Commit refreshed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/archive_music.m3u8
          if git diff --cached --quiet; then
            echo "Internet Archive music playlist has no changes."
          else
            git commit -m "Refresh Internet Archive music playlist"
            git push
          fi
