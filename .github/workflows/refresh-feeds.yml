name: Refresh IPTV Cat Feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-feeds.yml"
      - "scripts/**"
      - "requirements.txt"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-iptvcat-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Scrape and build playlists
        run: python scripts/refresh_playlists.py
      - name: Commit refreshed feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/usa.m3u8 playlists/canada.m3u8 playlists/uk.m3u8 playlists/all.m3u8 playlists/status.json
          if git diff --cached --quiet; then
            echo "IPTV Cat feeds are unchanged."
          else
            git commit -m "Refresh IPTV Cat playlists"
            git fetch origin main
            git rebase origin/main
            git push
          fi
