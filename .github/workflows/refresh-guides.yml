name: Refresh Roku EPG Guides

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-guides.yml"
      - "scripts/refresh_guides.py"
  schedule:
    - cron: "37 7 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-roku-tv-radio-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install guide fetch dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Download, decompress, and filter guide data
        run: python scripts/refresh_guides.py
      - name: Commit normalized guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/*.xml guides/status.json
          if git diff --cached --quiet; then
            echo "Guide files are unchanged."
          else
            git commit -m "Refresh normalized TV guides"
            git fetch origin main
            git rebase origin/main
            git push
          fi
