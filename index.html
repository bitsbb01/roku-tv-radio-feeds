<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09172b">
  <title>JGJG TV &amp; Radio</title>
  <style>
    :root { color-scheme: dark; --bg:#09172b; --panel:#102440; --blue:#56c8ed; --gold:#e3b34f; --text:#f4f7fb; --muted:#b9c8da; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; background:radial-gradient(ellipse at 50% 0%,#173c65 0,var(--bg) 65%); color:var(--text); font:17px/1.6 system-ui,sans-serif; }
    main { width:min(760px,100%); padding:clamp(2rem,6vw,4rem); border:1px solid #27476b; border-radius:24px; background:var(--panel); box-shadow:0 24px 80px #0008; }
    h1 { margin:0; color:var(--gold); font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; }
    p { color:var(--muted); }
    nav { display:flex; flex-wrap:wrap; gap:1rem; margin-top:2rem; }
    a { display:inline-block; padding:.8rem 1.15rem; border-radius:12px; color:#07162a; background:var(--blue); font-weight:700; text-decoration:none; }
    a:last-child { background:var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1>JGJG TV &amp; Radio</h1>
    <p>Information and policies for the JGJG TV &amp; Radio Roku app.</p>
    <nav aria-label="App policies">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </nav>
  </main>
</body>
</html>
